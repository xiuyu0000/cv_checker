workflow:
  prompts:
    fit_analysis: |
      阅读素材，基于我的开发需求和{candidate_name}的画像，判断这个{candidate_role}是否适配我的开发需求。请按以下结构输出：

      1. 适配证据：列出支持适配的关键证据，每条必须包含简历或需求中的直接引用，并说明该证据如何对应当前开发需求。
      2. 不适配证据：列出不支持适配、存在风险或材料不足的关键证据，每条必须包含直接引用；如果材料未提供，请明确写“材料未提供”，不要补全事实。
      3. 结论与风险：给出整体适配判断，并区分确定事实、合理推断和仍需面试核实的内容。

      证据边界：简历乱码、随机字符串、页眉页脚残留、平台导出或 PDF/OCR 解析异常，默认不作为真实性、候选人特质、职业严谨度或适配性的判断依据；若影响关键事实读取，只说明该事实无法确认。
    information_gaps: |
      基于你列出的适配和不适配的证据和观点，请进一步输出以下四类内容：

      1. 信息缺口：判断是否录用前仍缺少哪些关键事实、上下文或证据。
      2. 矛盾内容：简历、画像、项目经历或前后表述中需要进一步厘清的冲突、不一致或难以同时成立之处。
      3. 可疑/造假/包装：只基于实质证据判断，包括时间线、职责范围、成果指标、技术细节、业务常识、项目复杂度与资历匹配度；不要为了寻找异常而扩大解释。
      4. 真实性/重点考察：对当前开发需求至关重要、面试中必须核实真实性或深度的能力、经历和成果。

      证据边界：简历乱码、随机字符串、页眉页脚残留、平台导出或 PDF/OCR 解析异常，默认不作为真实性、候选人特质、职业严谨度或造假包装依据；若影响关键事实读取，只列为信息缺口，要求补充清晰版本。
    interview_template: |
      基于以上适配判断和信息缺口，请设计面试他的面评模板。模板包含三个模块：专业能力、学习能力、综合素质。每个模块约 3 个问题，不要过长。

      每个问题请包含：
      - 面试问题
      - 考察点
      - 参考优秀回答要点
      - 评价记录：

      问题必须来自 fit_analysis 和 information_gaps 中的实质证据、信息缺口、矛盾内容、可疑/造假/包装风险或真实性/重点考察项；避免泛泛提问，不要脱离当前开发需求。不要围绕简历乱码/导出异常设计面试问题，除非 information_gaps 明确指出关键事实不可读。
