workflow:
  prompts:
    fit_analysis: |
      阅读素材，基于我的开发需求和{candidate_name}的画像，判断这个{candidate_role}是否适配我的开发需求，请分别列出他适配和不适配的证据的直接引用。并解释你的逻辑链条。
    information_gaps: |
      基于你列出的适配和不适配的证据和观点，请进一步判断是否录用他的信息缺口有哪些，他的简历中是否存在矛盾的内容需要进一步厘清的，是有哪些内容是可疑的存在造假嫌疑的，有哪些内容对当前的开发需求至关重要需要进一步考察已确定真实性的。
    interview_template: |
      基于以上这些判断和信息缺口，请设计我面试他的面评模板，包含专业能力，学习能力，综合素质几个板块，基本格式是给出重点需要考察的问题以及参考答案，留出我写评价的位置，模板不要太长每个模块有 3 个左右的问题即可。
